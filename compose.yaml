services:
  symphony:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${MOMOFLOW_PORT:-4000}:4000"
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./WORKFLOW.md:/config/WORKFLOW.md:ro
      - workspaces:/data
      - codex-home:/home/momo/.codex
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/codex-seccomp.json
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/v1/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
volumes:
  workspaces:
  codex-home:
