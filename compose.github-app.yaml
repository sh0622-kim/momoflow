services:
  github-auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?Set GITHUB_INSTALLATION_ID}
      GITHUB_REPO: ${GITHUB_REPO:?Set GITHUB_REPO}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_FILE:?Set GITHUB_APP_PRIVATE_KEY_FILE}:/run/secrets/github-app.pem:ro
      - github-auth:/run/momoflow-auth
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, /opt/momoflow/github-app-auth.mjs, --health]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
  symphony:
    environment:
      GITHUB_TOKEN: ""
      GITHUB_TOKEN_FILE: /run/momoflow-auth/token.json
    depends_on:
      github-auth:
        condition: service_healthy
    volumes:
      - github-auth:/run/momoflow-auth:ro
volumes:
  github-auth:
